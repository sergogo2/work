<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Регистрация</h1>
            <p>Создайте учетную запись, чтобы получить доступ к дополнительным функциям</p>
        </div>
    </header>
    <main>
        <section id="registration">
            <h2>Форма регистрации</h2>
            <form action="/submit_registration" method="post">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Электронная почта:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>

                <label for="confirm_password">Подтвердите пароль:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>

                <button type="submit">Зарегистрироваться</button>
            </form>
            <button onclick="window.history.back()" style="margin-top: 20px; padding: 10px; background-color: #ff9900; color: white; border: none; border-radius: 5px; cursor: pointer;">Назад</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Кафе. Все права защищены.</p>
    </footer>
   
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Регистрация</h1>
            <p>Создайте учетную запись, чтобы получить доступ к дополнительным функциям</p>
        </div>
    </header>
    <main>
        <section id="registration">
            <h2>Форма регистрации</h2>
            <form action="/submit_registration" method="post">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Электронная почта:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>

                <label for="confirm_password">Подтвердите пароль:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>

                <button type="submit">Зарегистрироваться</button>
            </form>
            <button onclick="window.history.back()" style="margin-top: 20px; padding: 10px; background-color: #ff9900; color: white; border: none; border-radius: 5px; cursor: pointer;">Назад</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Кафе. Все права защищены.</p>
    </footer>
    <script>
        document.querySelector('form').addEventListener('submit', function(event) {
            event.preventDefault(); // Предотвращаем отправку формы

            // Создаем модальное окно
            const modal = document.createElement('div');
            modal.style.position = 'fixed';
            modal.style.top = '50%';
            modal.style.left = '50%';
            modal.style.transform = 'translate(-50%, -50%)';
            modal.style.backgroundColor = 'white';
            modal.style.padding = '20px';
            modal.style.boxShadow = '0 4px 10px rgba(0, 0, 0, 0.1)';
            modal.style.borderRadius = '10px';
            modal.style.zIndex = '1000';

            // Добавляем текст в модальное окно
            const message = document.createElement('p');
            message.textContent = 'Регистрация прошла успешно!';
            modal.appendChild(message);

            // Добавляем кнопку закрытия
            const closeButton = document.createElement('button');
            closeButton.textContent = 'Закрыть';
            closeButton.style.marginTop = '10px';
            closeButton.style.padding = '10px';
            closeButton.style.backgroundColor = '#ff9900';
            closeButton.style.color = 'white';
            closeButton.style.border = 'none';
            closeButton.style.borderRadius = '5px';
            closeButton.style.cursor = 'pointer';
            closeButton.addEventListener('click', function() {
                document.body.removeChild(modal);
            });
            modal.appendChild(closeButton);

            // Добавляем модальное окно на страницу
            document.body.appendChild(modal);
        });
    </script>
</body>
</html>
